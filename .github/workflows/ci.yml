name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - run: docker compose run --build --rm verify
      - name: Confirm generated corpus is reproducible
        run: test -z "$(git status --porcelain --untracked-files=all -- data/)"
      - run: docker compose run --rm gate
      - name: Confirm the committed benchmark matches the code
        run: git diff --exit-code -- docs/TESTING.md
      - run: docker compose run --rm drill
      - run: docker compose run --rm reference
      - run: docker compose run --rm openapi
      - run: docker compose run --rm lint
      - run: docker compose run --rm audit
      - name: No breaking API change against the last released contract
        run: |
          git fetch --no-tags --depth=1 origin 'refs/tags/v*:refs/tags/v*' 2>/dev/null || true
          base=""
          for tag in $(git tag -l 'v*' --sort=-v:refname); do
            if git cat-file -e "$tag:docs/api/openapi.json" 2>/dev/null; then base="$tag"; break; fi
          done
          if [ -z "$base" ]; then echo "no released API document yet; nothing to compare"; exit 0; fi
          echo "comparing against $base"
          git show "$base:docs/api/openapi.json" > "$RUNNER_TEMP/base-openapi.json"
          docker run --rm -v "$RUNNER_TEMP:/base:ro" -v "$PWD:/head:ro" tufin/oasdiff:v1.33.0 \
            breaking /base/base-openapi.json /head/docs/api/openapi.json --fail-on ERR
      - run: docker compose run --rm fuzz
      - run: docker compose run --rm smoke
      - name: Fetch main for the conformance baseline shrink check
        run: git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
      - run: docker compose run --rm conformance
      - run: docker compose run --rm browser
      - run: docker compose run --rm console
