name: Release

# A release exists only if the gate allowed it. Pushing a v* tag runs the full
# verification, the release gate and the gate drill; the GitHub release is
# created only after all three pass, with docs/TESTING.md attached.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  gate:
    name: Release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - run: docker compose run --build --rm verify
      - run: docker compose run --rm audit
      - run: docker compose run --rm gate
      - run: git diff --exit-code -- docs/TESTING.md
      - run: docker compose run --rm drill
      - run: docker compose run --rm reference
      - run: docker compose run --rm openapi
      - run: docker compose run --rm lint
      - run: docker compose run --rm conformance
      - run: docker compose run --rm browser
      - run: docker compose run --rm console
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-gate
          path: |
            docs/TESTING.md
            reports/eval-gate/report.json

  release:
    name: Publish release
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: eval-gate
      - name: Create the GitHub release with the gate report attached
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" \
            --notes-file docs/TESTING.md \
            docs/TESTING.md reports/eval-gate/report.json

  npm:
    name: Publish heatlot to npm
    needs: gate
    # Off until the package exists on npm and this workflow is its trusted publisher
    # (docs/DEPLOYMENT.md). Then set the repository variable NPM_TRUSTED_PUBLISHING to true.
    if: vars.NPM_TRUSTED_PUBLISHING == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Tag matches the package version
        run: test "${GITHUB_REF_NAME}" = "v$(node -p 'require("./package.json").version')"
      - name: The package installs and runs on its own
        run: npm run smoke:package
      - name: Publish with provenance (npm trusted publishing, no stored token)
        run: npm publish --provenance --access public
